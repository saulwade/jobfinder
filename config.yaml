# Configuración global del job finder. 100% local.
database:
  path: data/jobs.db

profile:
  master_profile: profile/master_profile.yaml
  master_cv: profile/master_cv.md

ai:
  provider: anthropic
  model: claude-sonnet-4-6      # tailoring CV/carta (calidad alta, ~3x mas barato que Opus)
  match_model: claude-haiku-4-5   # ranking masivo barato
  use_prompt_caching: true
  # API key se lee de la variable de entorno ANTHROPIC_API_KEY (.env)

search:
  remote_only: true
  weekly_application_target: 30
  min_score_to_apply: 65        # 0-100, umbral para entrar al pipeline de aplicación

# Fuentes de vacantes (Fase 1). Todas con API/RSS gratis.
sources:
  remoteok:    { enabled: true,  type: api }
  remotive:    { enabled: true,  type: api }
  weworkremotely: { enabled: true, type: rss }
  arbeitnow:   { enabled: true,  type: api }
  himalayas:   { enabled: true,  type: api }
  jobicy:      { enabled: true,  type: api }
  adzuna:      { enabled: true,  type: api }   # requiere APP_ID + APP_KEY gratis en .env
  usajobs:     { enabled: false, type: api }   # requiere email + API key gratis
  themuse:     { enabled: true,  type: api }
  jobspresso:  { enabled: true,  type: rss }
  workingnomads: { enabled: true, type: api }
  ats:         { enabled: true,  type: api }   # boards de empresas (Greenhouse/Lever/Ashby)
  getonboard:  { enabled: true,  type: api }   # LATAM, startups/pymes, con sueldo
  torre:       { enabled: true,  type: api }   # remoto global/LATAM

output:
  cv_dir: output/cv
  cover_letters_dir: output/cover_letters

# Scheduler (Fase 5): cuándo corre el pipeline solo
schedule:
  timezone: America/Monterrey
  days: "*"        # '*' = diario; o 'mon-fri', 'mon', etc.
  hour: 8
  minute: 0
